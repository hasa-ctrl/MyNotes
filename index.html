<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Catatan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="login-container">
        <h2>Catatan Pribadi</h2>
        <p>Silakan masuk untuk mengakses dashboard</p>
        <button id="login-btn">Masuk dengan Akun Google</button>
    </div>

    <div id="dashboard-screen" class="dashboard-container" style="display: none;">
        
        <aside class="sidebar">
            <h2>MyNotes</h2>
            <p id="user-name">Memuat...</p>
            <button id="logout-btn" style="background-color: #e74c3c; margin-top: 20px;">Keluar Sistem</button>
        </aside>

        <main class="main-content">
            <h1>Catatan Baru</h1>
            
            <div class="note-input-area">
                <div class="input-group">
                    <input type="text" id="note-title" placeholder="Judul Catatan..." style="flex: 1;">
                    <select id="note-category">
                        <option value="Umum">Umum</option>
                        <option value="Kampus">Kampus / Kuliah</option>
                        <option value="Magang">Magang (PT GS Battery)</option>
                        <option value="Proyek">Proyek IoT</option>
                    </select>
                </div>
                <textarea id="note-body" placeholder="Tulis sesuatu di sini..."></textarea>
                <button id="save-btn">Simpan Catatan</button>
            </div>
            
            <hr>
            <h2>Daftar Catatan</h2>
            <div id="notes-container" class="notes-grid"></div>
        </main>
        
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
